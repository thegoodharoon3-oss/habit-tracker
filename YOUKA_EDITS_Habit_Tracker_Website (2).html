<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YOUKA_EDITS Habit Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --gray-dark:#0A1747;
    --gray-med:#1B3FE0;
    --gray-soft:#DCE4F7;
    --gray-pale:#FFF8EC;
    --border:#C9D3F2;
    --text:#0A1747;
    --white:#ffffff;
    --green:#FFC940;
    --green-light:#FFE9A8;
    --green-dark:#1B3FE0;
    --royal:#1B3FE0;
    --gold:#FFC940;
    --ink:#0A1747;
    --cream:#FFF8EC;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:var(--white);
    color:var(--text);
  }
  body.rtl{font-family:"Segoe UI","Tahoma","Geeza Pro",Arial,sans-serif;}
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 24px;
    background:var(--white);
    border-bottom:3px solid transparent;
    border-image:linear-gradient(90deg,var(--royal),var(--gold)) 1;
    position:sticky;
    top:0;
    z-index:20;
    flex-wrap:wrap;
    gap:10px;
  }
  .brand{display:flex;align-items:center;gap:8px;}
  .brand svg{width:26px;height:26px;flex:none;}
  .brand .name{font-weight:800;font-size:14px;letter-spacing:.2px;}
  .brand .name .b1{color:var(--ink);}
  .brand .name .b2{color:var(--royal);}
  .brand .tag{font-size:9px;color:var(--gray-med);letter-spacing:1px;margin-top:1px;}

  nav.months{display:flex;flex-wrap:wrap;gap:4px;}
  nav.months button{
    border:1px solid var(--border);
    background:var(--white);
    color:var(--text);
    font-size:12px;
    padding:6px 10px;
    border-radius:6px;
    cursor:pointer;
    transition:background .15s, color .15s;
  }
  nav.months button:hover{background:var(--gray-pale);}
  nav.months button.active{background:var(--gray-dark);color:#fff;border-color:var(--gray-dark);}
  nav.months button.dash{border-color:var(--green-dark);color:var(--green-dark);font-weight:700;}
  nav.months button.dash.active{background:var(--green-dark);color:#fff;}

  .topbar-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  button.ghost-btn{
    border:1px solid var(--border);background:#fff;color:var(--text);
    font-size:12px;padding:6px 10px;border-radius:6px;cursor:pointer;font-family:inherit;white-space:nowrap;
  }
  button.ghost-btn:hover{background:var(--gray-pale);}

  .reminder-wrap{position:relative;}
  .reminder-panel{
    position:absolute;top:120%;inset-inline-end:0;background:#fff;border:1px solid var(--border);
    border-radius:8px;padding:10px;box-shadow:0 8px 20px rgba(10,23,71,.15);
    display:flex;gap:6px;align-items:center;z-index:30;
  }
  .reminder-panel input[type="time"]{padding:6px;border:1px solid var(--border);border-radius:6px;font-family:inherit;}
  .reminder-note{font-size:9px;color:var(--gray-med);max-width:150px;line-height:1.4;}

  main{padding:24px 28px 60px;max-width:1400px;margin:0 auto;}

  h1.title{font-size:38px;font-weight:800;color:var(--gray-dark);margin:0 0 14px 0;}

  .stats{display:flex;gap:36px;align-items:center;margin-bottom:22px;flex-wrap:wrap;}
  .stat-label{font-size:11px;color:var(--gray-med);font-weight:700;margin-bottom:2px;}
  .stat-value{font-size:20px;font-weight:800;color:var(--text);}
  .progress-wrap{display:flex;align-items:center;gap:10px;}
  .progress-track{width:180px;height:14px;background:var(--gray-soft);border-radius:7px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--green-light),var(--green));border-radius:7px;transition:width .3s;}

  .wheel-wrap{position:relative;width:118px;height:118px;flex:none;}
  .wheel-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;pointer-events:none;}
  .wheel-center b{font-size:19px;color:var(--ink);}
  .wheel-center span{font-size:8px;color:var(--gray-med);font-weight:700;max-width:70px;text-align:center;line-height:1.2;margin-top:2px;}

  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:4px;margin-bottom:6px;}
  table.habit-table{border-collapse:collapse;width:100%;font-size:12px;}
  table.habit-table th, table.habit-table td{
    border:1px solid var(--border);
    text-align:center;
    padding:0;
    min-width:26px;
    height:24px;
  }
  .myhabits-th{
    background:var(--gray-soft);
    font-weight:700;
    text-align:left !important;
    padding:6px 10px !important;
    min-width:180px;
    font-size:14px;
  }
  .week-th{background:var(--gray-med);color:#fff;font-weight:700;font-size:11px;}
  .weekday-th{background:var(--gray-soft);font-size:10px;font-weight:700;}
  .daynum-th{background:var(--gray-soft);font-size:10px;font-weight:700;}
  .habit-name{
    text-align:left !important;
    padding:0 !important;
    font-size:12px;
    white-space:nowrap;
  }
  input.habit-name-input{
    width:100%;height:100%;border:none;background:transparent;
    font-size:12px;color:var(--text);padding:4px 10px;font-family:inherit;
  }
  input.habit-name-input:focus{outline:2px solid var(--green);background:#fff;}
  .del-habit{
    color:var(--gray-med);cursor:pointer;font-size:12px;width:26px;
    border-left:none !important;
  }
  .del-habit:hover{color:#c0392b;background:var(--gray-pale);}
  .add-habit-cell{
    text-align:left !important;padding:6px 10px !important;color:var(--green-dark);
    font-weight:700;font-size:12px;cursor:pointer;background:var(--white);
  }
  .add-habit-cell:hover{background:var(--green-light);}
  tr.odd td{background:var(--white);}
  tr.even td{background:var(--gray-pale);}
  .chk{cursor:pointer;user-select:none;font-weight:700;color:transparent;}
  .chk.checked{background:var(--gold);color:var(--ink);}
  .chk:hover{outline:2px solid var(--royal);outline-offset:-2px;}

  .summary-row td, .summary-row th{font-size:10px;background:var(--gray-pale);}
  .summary-label{
    background:var(--gray-soft) !important;
    font-weight:700;
    text-align:center !important;
    font-size:10px;
    line-height:1.5;
  }

  .chart-box{border:1px solid var(--border);border-radius:4px;padding:12px;margin:18px 0;max-width:900px;}
  .section-title{font-size:20px;font-weight:800;color:var(--royal);margin:26px 0 10px;}
  .mood-row td{background:#fff;}
  .mood-label{background:var(--gray-pale) !important;font-weight:700;font-size:11px;text-align:left !important;padding:4px 10px !important;}
  input.mood-input{width:100%;height:100%;border:none;text-align:center;font-size:10px;background:transparent;}
  input.mood-input:focus{outline:2px solid var(--green);}

  .analysis-flex{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start;}
  table.analysis-table{border-collapse:collapse;font-size:12px;}
  table.analysis-table th,table.analysis-table td{border:1px solid var(--border);padding:5px 14px;text-align:center;}
  table.analysis-table th{background:var(--gray-med);color:#fff;}
  table.analysis-table tr:nth-child(even) td{background:var(--gray-pale);}

  .insights-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:6px;}
  .insight-card{background:var(--gray-pale);border-radius:8px;padding:12px 14px;font-size:12.5px;line-height:1.6;}

  .badges-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:10px;}
  .badge-card{border:1px solid var(--border);border-radius:10px;padding:12px 8px;text-align:center;background:#fff;}
  .badge-card.earned{background:linear-gradient(160deg,#fff,var(--gray-pale));border-color:var(--gold);box-shadow:0 4px 14px rgba(255,201,64,.35);}
  .badge-card.locked{opacity:.55;}
  .badge-emoji{font-size:26px;margin-bottom:6px;}
  .badge-label{font-size:11px;font-weight:700;}
  .badge-progress{font-size:10px;color:var(--gray-med);margin-top:4px;}

  .dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:24px;}
  .month-card{border:1px solid var(--border);border-top-width:4px;border-radius:6px;overflow:hidden;}
  .month-card h3{margin:0;background:var(--gray-med);color:#fff;padding:8px 10px;font-size:14px;}
  .month-card .row{display:flex;justify-content:space-between;padding:6px 10px;font-size:12px;border-top:1px solid var(--border);}
  .month-card .row b{color:var(--text);}
  .month-card .row.progress b{color:var(--gold);background:var(--ink);padding:1px 8px;border-radius:10px;font-size:11px;}

  footer{text-align:center;font-size:10px;color:var(--gray-med);padding:20px;font-style:italic;}

  .login-wrap{max-width:380px;margin:70px auto;padding:32px 28px;border:1px solid var(--border);border-radius:14px;text-align:center;box-shadow:0 10px 30px rgba(10,23,71,.08);}
  .login-wrap h1{font-size:24px;margin:0 0 6px;color:var(--gray-dark);}
  .login-wrap p{font-size:13px;color:var(--gray-med);margin:0 0 20px;line-height:1.5;}
  .login-wrap input{width:100%;padding:12px 14px;font-size:15px;border:1px solid var(--border);border-radius:8px;margin-bottom:14px;font-family:inherit;text-align:center;}
  .login-wrap input:focus{outline:2px solid var(--gold);}
  .login-wrap button.primary{
    width:100%;padding:12px;font-size:15px;font-weight:700;border:none;border-radius:8px;
    background:linear-gradient(90deg,var(--royal),var(--gold));color:#fff;cursor:pointer;font-family:inherit;
  }
  .login-wrap button.primary:hover{opacity:.92;}
  .login-note{font-size:10px;color:var(--gray-med);margin-top:14px;line-height:1.5;}

  body.rtl .myhabits-th, body.rtl .habit-name, body.rtl .add-habit-cell, body.rtl .mood-label{text-align:right !important;}
  body.rtl .analysis-table td:first-child, body.rtl .analysis-table th:first-child{text-align:right !important;}

  @media print{
    .topbar-actions, nav.months, .add-habit-cell, .del-habit, footer, .login-wrap{display:none !important;}
    body{background:#fff;}
    .topbar{position:static;}
  }

  @media (max-width:700px){
    h1.title{font-size:28px;}
    .stats{gap:20px;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#1B3FE0" stroke="#0A1747" stroke-width="3"/><polygon points="34,28 34,72 74,50" fill="#FFF8EC" stroke="#0A1747" stroke-width="2"/><circle cx="66" cy="34" r="9" fill="#FFC940" stroke="#0A1747" stroke-width="1.5"/></svg>
    <div>
      <div class="name"><span class="b1">YOUKA</span><span class="b2">_EDITS</span></div>
      <div class="tag" id="brandTag">HABIT TRACKER</div>
    </div>
  </div>
  <nav class="months" id="monthNav"></nav>
  <div class="topbar-actions" id="topbarActions"></div>

<main id="content"></main>

<footer><span id="footerText">YOUKA_EDITS &mdash; Video &middot; Thumbnails &middot; AI</span></footer>

let lang = localStorage.getItem(LANG_KEY) || "en";
let loggedInPhone = null;
let nextHabitId = 1;
let habits = [];
const state = {};
let currentView = 0; // 0-11 = month index, "dash" = dashboard
let charts = {};

function t(key){ return (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key; }
function monthName(i){ return lang==='ar' ? MONTHS_AR[i] : MONTHS_EN[i]; }
function monthShort(i){ return lang==='ar' ? MONTHS_AR_SHORT[i] : MONTHS_EN_SHORT[i]; }
function weekdayLetter(d){ return (lang==='ar' ? WEEKDAY_AR : WEEKDAY_EN)[d%7]; }
function habitColor(h){ return h.color || PALETTE[(h.id-1)%PALETTE.length]; }

function setLang(l){
  lang = l;
  localStorage.setItem(LANG_KEY, l);
  document.documentElement.lang = l;
  document.documentElement.dir = l==='ar' ? 'rtl' : 'ltr';
  document.body.classList.toggle('rtl', l==='ar');
  applyStaticText();
}
function applyStaticText(){
  document.getElementById('brandTag').textContent = t('tagline');
  document.getElementById('footerText').textContent = t('footer');
  document.title = "YOUKA_EDITS " + (lang==='ar' ? "متابعة العادات" : "Habit Tracker");
}

function newHabit(name){
  const h = { id: nextHabitId++, name };
  h.color = PALETTE[(h.id-1)%PALETTE.length];
  return h;
}
function defaultHabits(){
  nextHabitId = 1;
  const names = lang==='ar' ? ARABIC_DEFAULTS : ENGLISH_DEFAULTS;
  return names.map(newHabit);
}

// ---- auth / per-phone storage ----
function dataKeyFor(phone){ return STORAGE_PREFIX + phone; }
function getSession(){ return localStorage.getItem(SESSION_KEY); }
function setSession(phone){ localStorage.setItem(SESSION_KEY, phone); }
function clearSession(){ localStorage.removeItem(SESSION_KEY); }

function loadAccountData(phone){
  charts = {};
  Object.keys(state).forEach(k=>delete state[k]);
  const raw = localStorage.getItem(dataKeyFor(phone));
  if(raw){
    try{
      const parsed = JSON.parse(raw);
      habits = (parsed.habits && parsed.habits.length) ? parsed.habits : defaultHabits();
      nextHabitId = parsed.nextHabitId || (Math.max(...habits.map(h=>h.id))+1);
      Object.keys(parsed.state||{}).forEach(k=>{ state[k] = parsed.state[k]; });
      return;
    }catch(e){ console.warn("Could not load saved data:", e); }
  }
  habits = defaultHabits();
  ensureMonth(0).checks[habits[0].id] = [true,true,true,false,true,true,...Array(25).fill(false)];
}

function saveState(){
  if(!loggedInPhone) return;
  try{
    localStorage.setItem(dataKeyFor(loggedInPhone), JSON.stringify({ habits, state, nextHabitId }));
  }catch(e){ console.warn("Could not save:", e); }
}

function login(phone){
  setSession(phone);
  loggedInPhone = phone;
  loadAccountData(phone);
  currentView = 0;
  buildNav();
  render();
}
function logout(){

}

// ---- backup / restore ----
function exportData(){
  const payload = { habits, state, nextHabitId, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `youka_habit_backup_${loggedInPhone||'data'}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function handleImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed.habits || !Array.isArray(parsed.habits)) throw new Error('bad file');
      habits = parsed.habits;
      nextHabitId = parsed.nextHabitId || (Math.max(...habits.map(h=>h.id))+1);
      Object.keys(state).forEach(k=>delete state[k]);
      Object.keys(parsed.state||{}).forEach(k=>{ state[k]=parsed.state[k]; });
      saveState();
      buildNav();
      render();
      alert(t('importSuccess'));
    }catch(err){
      alert(t('importError'));
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// ---- reminders ----
function reminderKeyFor(phone){ return 'youka_reminder_time_'+phone; }
function getReminderTime(){ return loggedInPhone ? localStorage.getItem(reminderKeyFor(loggedInPhone)) : null; }
function setReminderTimeStorage(v){ if(loggedInPhone) localStorage.setItem(reminderKeyFor(loggedInPhone), v); }
function clearReminderTime(){ if(loggedInPhone) localStorage.removeItem(reminderKeyFor(loggedInPhone)); }
function enableReminder(hhmm){
  if(!('Notification' in window)){ alert(t('notifUnsupported')); return; }
  Notification.requestPermission().then(perm=>{
    if(perm==='granted'){
      setReminderTimeStorage(hhmm);
      alert(t('reminderSavedMsg'));
    } else {
      alert(t('notifDenied'));
    }
  });
}
function checkReminder(){
  if(!loggedInPhone) return;
  const time = getReminderTime();
  if(!time) return;
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  const current = `${hh}:${mm}`;
  const lastFiredKey = 'youka_reminder_last_'+loggedInPhone;
  const todayStr = now.toDateString();
  if(current===time && localStorage.getItem(lastFiredKey)!==todayStr){
    const m = now.getMonth(), d = now.getDate()-1;
    const s = ensureMonth(m);
    const pending = habits.filter(h=> !(s.checks[h.id] && s.checks[h.id][d]));
    const body = pending.length
      ? (lang==='ar' ? `باقيلك ${pending.length} عادة النهاردة` : `${pending.length} habits left today`)
      : (lang==='ar' ? 'كملت كل عاداتك النهاردة! 🎉' : 'All habits done today! 🎉');
    new Notification('YOUKA_EDITS', { body });
    localStorage.setItem(lastFiredKey, todayStr);
  }
}

// ---- derived data helpers ----
function ensureMonth(m){
  if(!state[m]) state[m] = { checks:{}, mood: Array(DAYS_IN_MONTH[m]).fill("") };
  const s = state[m];
  habits.forEach(h=>{
    if(!s.checks[h.id]) s.checks[h.id] = Array(DAYS_IN_MONTH[m]).fill(false);
  });
  if(s.mood.length < DAYS_IN_MONTH[m]){
    while(s.mood.length < DAYS_IN_MONTH[m]) s.mood.push("");
  }
  return s;
}
function monthProgress(m){
  const s = ensureMonth(m);
  const days = DAYS_IN_MONTH[m];
  let done=0, total=habits.length*days;
  habits.forEach(h=>s.checks[h.id].forEach(v=>{if(v)done++;}));
  return total? done/total : 0;
}
function monthCompleted(m){
  const s = ensureMonth(m);
  let done=0;
  habits.forEach(h=>s.checks[h.id].forEach(v=>{if(v)done++;}));
  return done;
}
function dailyProgress(m){
  const s = ensureMonth(m);
  const days = DAYS_IN_MONTH[m];
  const arr = [];
  for(let d=0; d<days; d++){
    let done=0;
    habits.forEach(h=>{ if(s.checks[h.id][d]) done++; });
    arr.push(habits.length? done/habits.length : 0);
  }
  return arr;
}

// ---- streaks & achievements ----
function flattenHabit(h){
  let arr = [];
  for(let m=0;m<12;m++){
    const s = ensureMonth(m);
    arr = arr.concat(s.checks[h.id]);
  }
  return arr;
}
function bestStreak(h){
  const arr = flattenHabit(h);
  let best=0, cur=0;
  arr.forEach(v=>{ if(v){ cur++; if(cur>best) best=cur; } else cur=0; });
  return best;
}
function todayIndexFlat(){
  const now = new Date();
  const mo = now.getMonth(), da = now.getDate()-1;
  let idx=0;
  for(let m=0;m<mo;m++) idx += DAYS_IN_MONTH[m];
  return idx + da;
}
function currentStreak(h){
  const arr = flattenHabit(h);
  const idx = Math.min(todayIndexFlat(), arr.length-1);
  let cur=0;
  for(let i=idx;i>=0;i--){ if(arr[i]) cur++; else break; }
  return cur;
}
function totalCheckins(h){ return flattenHabit(h).filter(Boolean).length; }
function totalCheckinsAll(){ return habits.reduce((sum,h)=>sum+totalCheckins(h),0); }
function bestStreakAll(){ return habits.reduce((mx,h)=>Math.max(mx,bestStreak(h)),0); }
function bestPerfectStreak(){
  if(!habits.length) return 0;
  const flatPerHabit = habits.map(h=>flattenHabit(h));
  const len = flatPerHabit[0].length;
  let best=0, cur=0;
  for(let i=0;i<len;i++){
    const allDone = flatPerHabit.every(arr=>arr[i]);
    if(allDone){ cur++; if(cur>best) best=cur; } else cur=0;
  }
  return best;
}
function achievementValue(type){
  if(type==='streak') return bestStreakAll();
  if(type==='total') return totalCheckinsAll();
  if(type==='perfect') return bestPerfectStreak();
  return 0;
}
function renderAchievements(){
  let html = `<div class="section-title">${t('achievementsTitle')}</div><div class="badges-grid">`;
  BADGE_DEFS.forEach(b=>{
    const val = achievementValue(b.type);
    const earned = val >= b.min;
    const label = t(BADGE_KEY_MAP[b.id]);
    html += `<div class="badge-card ${earned?'earned':'locked'}">
      <div class="badge-emoji">${earned?b.emoji:'🔒'}</div>
      <div class="badge-label">${label}</div>
      <div class="badge-progress">${earned ? (lang==='ar'?'اتحققت':'Unlocked') : Math.min(val,b.min)+'/'+b.min}</div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

// ---- insights ----
function generateInsights(m){
  const tips = [];
  const s = ensureMonth(m);
  const days = DAYS_IN_MONTH[m];
  const actualsByHabit = habits.map(h=>({ h, actual: s.checks[h.id].filter(Boolean).length }));
  const anyData = actualsByHabit.some(o=>o.actual>0);
  if(!anyData) return tips;

  const sorted = [...actualsByHabit].sort((a,b)=>b.actual-a.actual);
  const best = sorted[0], weak = sorted[sorted.length-1];
  if(best.actual>0){
    tips.push(lang==='ar'
      ? `أقوى عادة عندك الشهر ده هي "${best.h.name}" (${best.actual}/${days} يوم). كمّل عليها! 💪`
      : `Your strongest habit this month is "${best.h.name}" (${best.actual}/${days} days). Keep it up! 💪`);
  }
  if(weak.actual < days*0.4){
    tips.push(lang==='ar'
      ? `عادة "${weak.h.name}" هي الأضعف (${weak.actual}/${days} يوم). جرّب تربطها بعادة تانية بتعملها بالفعل عشان تسهل عليك.`
      : `"${weak.h.name}" is your weakest habit (${weak.actual}/${days} days). Try pairing it right after a habit you already do consistently.`);
  }

  const weekdayTotals = Array(7).fill(0), weekdayCounts = Array(7).fill(0);
  for(let d=0; d<days; d++){
    const wd = d%7;
    let done=0; habits.forEach(h=>{ if(s.checks[h.id][d]) done++; });
    weekdayTotals[wd]+=done; weekdayCounts[wd]++;
  }
  const weekdayAvg = weekdayTotals.map((tot,i)=> weekdayCounts[i] ? tot/weekdayCounts[i] : 0);
  const maxWd = weekdayAvg.indexOf(Math.max(...weekdayAvg));
  const minWd = weekdayAvg.indexOf(Math.min(...weekdayAvg));
  if(Math.max(...weekdayAvg) > 0 && maxWd!==minWd){
    tips.push(lang==='ar'
      ? `بتخلّص عاداتك أكتر أيام ${weekdayLetter(maxWd)}، وبتقل أيام ${weekdayLetter(minWd)}. حاول تحط تذكير أقوى في الأيام الضعيفة.`
      : `You complete the most on ${weekdayLetter(maxWd)} and the least on ${weekdayLetter(minWd)}. Consider a stronger reminder on your weaker days.`);
  }

  if(m>0){
    const prevProgress = monthProgress(m-1);
    const curProgress = monthProgress(m);
    if(prevProgress>0){
      const diff = Math.round((curProgress-prevProgress)*100);
      if(diff>0) tips.push(lang==='ar' ? `تقدمك زاد ${diff}% عن ${monthName(m-1)}. 🎉` : `Your progress is up ${diff}% from ${monthName(m-1)}. 🎉`);
      else if(diff<0) tips.push(lang==='ar' ? `تقدمك قلّ ${Math.abs(diff)}% عن ${monthName(m-1)}، مفيش مشكلة، حاول تركز أسبوع بأسبوع.` : `Your progress dropped ${Math.abs(diff)}% from ${monthName(m-1)} — no worries, try focusing week by week.`);
    }
  }

  const moodPairs = [];
  for(let d=0; d<days; d++){
    const moodVal = parseFloat(s.mood[d]);
    if(!isNaN(moodVal)){
      let done=0; habits.forEach(h=>{ if(s.checks[h.id][d]) done++; });
      moodPairs.push({ rate: habits.length? done/habits.length : 0, mood: moodVal });
    }
  }
  if(moodPairs.length>=5){
    const high = moodPairs.filter(p=>p.rate>=0.7);
    const low = moodPairs.filter(p=>p.rate<0.4);
    if(high.length>=2 && low.length>=2){
      const avgHigh = high.reduce((a,p)=>a+p.mood,0)/high.length;
      const avgLow = low.reduce((a,p)=>a+p.mood,0)/low.length;
      if(avgHigh - avgLow >= 1){
        tips.push(lang==='ar'
          ? `مزاجك بيبقى أحسن (${avgHigh.toFixed(1)} مقابل ${avgLow.toFixed(1)}) في الأيام اللي بتخلّص فيها معظم عاداتك.`
          : `Your mood is noticeably better (${avgHigh.toFixed(1)} vs ${avgLow.toFixed(1)}) on days you complete most of your habits.`);
      }
    }
  }

  const bestCur = habits.map(h=>({h, cur:currentStreak(h)})).sort((a,b)=>b.cur-a.cur)[0];
  if(bestCur && bestCur.cur>=3){
    tips.push(lang==='ar'
      ? `عندك ستريك ${bestCur.cur} يوم متواصل في "${bestCur.h.name}"! متكسروش السلسلة. 🔥`
      : `You're on a ${bestCur.cur}-day streak for "${bestCur.h.name}"! Don't break the chain. 🔥`);
  }

  return tips.slice(0,5);
}

  document.querySelectorAll('.mood-input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      s.mood[+inp.dataset.moodD] = inp.value;
      saveState();
    });
  });
  // editable habit names (commit on blur / Enter, so typing isn't interrupted)
  document.querySelectorAll('.habit-name-input').forEach(inp=>{
    const commit = ()=>{
      const h = habits.find(x=>x.id===+inp.dataset.hid);
      if(h){ h.name = inp.value.trim() || t('untitled'); saveState(); renderMonth(m); }
    };
    inp.addEventListener('blur', commit);
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ inp.blur(); } });
  });
  // delete habit
  document.querySelectorAll('.del-habit').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const hid = +btn.dataset.hid;
      if(habits.length<=1){ alert(t('keepAtLeast')); return; }
      if(!confirm(t('removeConfirm'))) return;
      habits = habits.filter(h=>h.id!==hid);
      Object.keys(state).forEach(mi=>{ delete state[mi].checks[hid]; });
      saveState();
      renderMonth(m);
    });
  });
  // add habit
  const addCell = document.querySelector('.add-habit-cell');
  if(addCell){
    addCell.addEventListener('click', ()=>{
      const h = newHabit(t('newHabitDefault'));
      habits.push(h);
      Object.keys(state).forEach(mi=>{
        state[mi].checks[h.id] = Array(DAYS_IN_MONTH[mi]).fill(false);
      });
      saveState();
      renderMonth(m);
    });
  }

  drawAreaChart(m);
  drawBarChart(m);
  drawWheelChart(m);
}

function drawAreaChart(m){
  const ctx = document.getElementById('areaChart');
  if(charts.area) charts.area.destroy();
  const daily = dailyProgress(m).map(v=>Math.round(v*100));
  charts.area = new Chart(ctx, {
    type:'line',
    data:{ labels: daily.map((_,i)=>i+1),
      datasets:[{ data: daily, borderColor:'#1B3FE0', backgroundColor:'#DCE4F7', fill:true, tension:.35, pointRadius:0, borderWidth:3 }]},
    options:{ plugins:{legend:{display:false}}, scales:{ y:{ min:0, max:120, ticks:{callback:v=>v+'%'} } }, responsive:true }
  });
}
function drawBarChart(m){
  const s = ensureMonth(m);
  const ctx = document.getElementById('barChart');
  if(charts.bar) charts.bar.destroy();
  const actuals = habits.map(h=>s.checks[h.id].filter(Boolean).length);
  charts.bar = new Chart(ctx, {
    type:'bar',
    data:{ labels: habits.map(h=>h.name), datasets:[{ label: t('progressLabel'), data: actuals, backgroundColor: habits.map(habitColor) }]},
    options:{ indexAxis:'y', plugins:{legend:{display:false},title:{display:true,text:t('progressLabel')}}, responsive:true }
  });
}
function drawWheelChart(m){
  const s = ensureMonth(m);
  const ctx = document.getElementById('wheelChart');
  if(!ctx) return;
  if(charts.wheel) charts.wheel.destroy();
  const actuals = habits.map(h=>s.checks[h.id].filter(Boolean).length);
  const total = actuals.reduce((a,b)=>a+b,0);
  let data, colors;
  if(total===0){ data=[1]; colors=['#E3E8F7']; }
  else { data=actuals; colors=habits.map(habitColor); }
  charts.wheel = new Chart(ctx, {
    type:'doughnut',
    data:{ labels: habits.map(h=>h.name), datasets:[{ data, backgroundColor: colors, borderWidth:0 }] },
    options:{ cutout:'72%', plugins:{ legend:{display:false}, tooltip:{enabled: total>0} }, responsive:true, maintainAspectRatio:true }
  });
}

function renderDashboard(){
  let html = `<h1 class="title">${t('yearlyStats')}</h1>`;
  html += `<div class="chart-box" style="max-width:1100px;"><canvas id="yearChart" height="70"></canvas></div>`;
  html += `<div class="dash-grid">`;
  MONTHS_EN.forEach((mn,i)=>{
    const p = Math.round(monthProgress(i)*100);
    const accent = PALETTE[i % PALETTE.length];
    html += `<div class="month-card" style="border-top-color:${accent};">
      <h3>${monthName(i)}</h3>
      <div class="row"><span>${t('numberOfHabits')}</span><b>${habits.length}</b></div>
      <div class="row"><span>${t('completedCard')}</span><b>${monthCompleted(i)}</b></div>
      <div class="row progress"><span>${t('progressCard')}</span><b>${p}%</b></div>
    </div>`;
  });
  html += `</div>`;
  html += renderAchievements();
  document.getElementById('content').innerHTML = html;

  const ctx = document.getElementById('yearChart');
  if(charts.year) charts.year.destroy();
  charts.year = new Chart(ctx, {
    type:'line',
    data:{ labels: MONTHS_EN.map((_,i)=>monthShort(i)),
      datasets:[{ data: MONTHS_EN.map((_,i)=>Math.round(monthProgress(i)*100)), borderColor:'#1B3FE0', backgroundColor:'#DCE4F7', fill:true, tension:.35, pointRadius:4, borderWidth:3, pointBackgroundColor:'#FFC940', pointBorderColor:'#0A1747' }]},
    options:{ plugins:{legend:{display:false}}, scales:{ y:{ min:0, max:100, ticks:{callback:v=>v+'%'} } }, responsive:true }
  });
}

// ---- top-level dispatcher ----
function render(){
  if(!loggedInPhone){ renderLoginView(); return; }
  renderTopbarActions();
  document.querySelectorAll('#monthNav button').forEach(b=>b.classList.remove('active'));
  const btns = document.querySelectorAll('#monthNav button');
  if(currentView==='dash'){ btns[12].classList.add('active'); renderDashboard(); }
  else { btns[currentView].classList.add('active'); renderMonth(currentView); }
}

// ---- init ----
setLang(lang);
const existingPhone = getSession();
if(existingPhone){ loggedInPhone = existingPhone; loadAccountData(existingPhone); }
buildNav();
render();
</script>
</body>
</html>
